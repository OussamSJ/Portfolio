name: React CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Configuration Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Installation des dépendances
        run: npm install

      - name: Lancement des tests
        run: npm test -- --watchAll=false

      - name: Build de l'application
        run: npm run build

      - name: Upload du build en artefacts
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: build

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Déploiement vers l'environnement de staging
        run: echo "Déploiement sur STAGING..."
        # Ici tu mets ton script ou action pour déployer vers staging
     

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Déploiement vers l'environnement de production
        run: echo "Déploiement sur PRODUCTION..."
        # Ici tu mets ton script ou action pour déployer vers prod
